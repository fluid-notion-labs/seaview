[package]
name = "seaview"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "seaview"
path = "src/lib.rs"

[[bin]]
name = "seaview"
path = "src/main.rs"

[dependencies]
bevy = { workspace = true }
# baby_shark = { workspace = true }  # TODO: Re-enable when vendor/baby_shark is available
nalgebra = "0.33.2"
stl_io = "0.7"
clap = { version = "4.5", features = ["derive"] }
# bevy_brp_extras = { git = "https://github.com/natepiano/bevy_brp.git", rev = "6edff47" }  # TODO: Update for Bevy 0.18
regex = "1.10"
rayon = "1.10"
byteorder = "1.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
bevy_egui = { workspace = true }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

log = { version = "0.4", features = [] }          # Still needed for binary tools
env_logger = "0.10"                               # Still needed for binary tools
crossbeam-channel = "0.5"
meshopt = "0.3"
thiserror = "1.0"
glob = "0.3"
gltf = { version = "1.4", features = ["import"] }
threadpool = "1.8"
sysinfo = "0.37"

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
# Maximum performance: disable all logging at compile time
max-perf = [
    "log/max_level_off",
    "log/release_max_level_off",
]
# Performance profiling: Chrome trace output (open in chrome://tracing or Perfetto)
trace_chrome = ["bevy/trace_chrome"]
# Performance profiling: Tracy profiler integration
trace_tracy = ["bevy/trace_tracy"]
# System information diagnostics (CPU/memory usage)
sysinfo_plugin = ["bevy/sysinfo_plugin"]
# Dev tools (FPS overlay, frame time graph, etc.)
bevy_dev_tools = ["bevy/bevy_dev_tools"]
# Convenience: enable all perf debugging features (except tracy)
perf = ["trace_chrome", "sysinfo_plugin"]
# NVIDIA Management Library for accurate VRAM detection (requires NVML installed)
nvml = []


