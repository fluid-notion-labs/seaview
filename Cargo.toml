[workspace]
members = ["crates/seaview"]
exclude = [
    "vendor/bevy",
    "vendor/bevy_brp",
    "vendor/loadfu-old",
    "vendor/mesh-ripper",
    "vendor/stl_io",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Seaview Contributors"]

[workspace.dependencies]
# r600: bevy comes from our forks, wired via [patch.crates-io] at the
# bottom of this file.
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",

    "bevy_pbr",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "multi_threaded",
    "wayland",
    "bevy_gizmos",
    "tonemapping_luts",
    "default_font",
    "png",
    "jpeg",
    "exr",
    "hdr",
    "bevy_remote",
    "bevy_mesh",
    "bevy_image",
    "bevy_color",
    "bevy_shader",
    "bevy_gltf",
    "bevy_scene",
    "bevy_camera",
    "bevy_light",
    "bevy_post_process",
    "bevy_log",
    "zstd_rust",
    "reflect_auto_register",
] }
# Native GL backend for machines without a Vulkan driver (r600/llvmpipe).
bevy_render = { version = "0.19", features = ["gles"] }
# Meshlet feature is additive — enabled per-crate via the `meshlet` feature flag.
# 0.40 pairs with bevy 0.19.
bevy_egui = "0.40"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Performance-optimized release profile with maximum optimizations
# To disable logging at compile time, build with: cargo build --profile release-perf --features max-perf
[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.release-perf.package."*"]
opt-level = 3

# r600 compatibility patches (AMD HD 5770, GL-only, no Vulkan). The
# patched sources live in our GitHub forks, on branches named after the
# release they patch; local checkouts for iterating on them live under
# vendor/ (untracked):
#
#   fluid-notion-labs/bevy-r600  branch r600-0.19.1 (fork of bevyengine/bevy)
#     bevy_window:  InstanceDisplayHandle resource (display handle for
#                   the wgpu instance; without it wgpu's GL backend uses
#                   surfaceless EGL -> no window surfaces -> panic)
#     bevy_winit:   capture the event loop's display handle into it
#     bevy_render:  pass it to initialize_renderer -> InstanceDescriptor
#     bevy_pbr:     point shadows: textureSampleCompare instead of
#                   textureSampleCompareLevel (the latter lowers to
#                   extension-only textureLod(samplerCubeArrayShadow))
#   fluid-notion-labs/wgpu-r600  branch r600-29.0.4 (fork of gfx-rs/wgpu;
#     naga the crate is developed inside the wgpu monorepo)
#     naga GLSL backend: never require GL_EXT_texture_shadow_lod
#     (unsupported by r600; kills every PBR pipeline)
#
# Patching the umbrella bevy crate (repo root) pulls the whole bevy
# workspace from the fork; patching crates individually would mix fork
# and registry copies of the same versions, which do NOT unify (types
# don't match). Bump: rebase the branch on the new release tag, push,
# update here.
[patch.crates-io]
bevy = { git = "https://github.com/fluid-notion-labs/bevy-r600", branch = "r600-0.19.1" }
bevy_render = { git = "https://github.com/fluid-notion-labs/bevy-r600", branch = "r600-0.19.1" }
naga = { git = "https://github.com/fluid-notion-labs/wgpu-r600", branch = "r600-29.0.4" }
# bevy_egui depends on individual bevy crates; without these entries they
# resolve to registry copies that do NOT unify with the fork (types don't
# match). Keep in sync with bevy_egui's bevy_* dependency list.
bevy_app = { git = "https://github.com/fluid-notion-labs/bevy-r600", branch = "r600-0.19.1" }
bevy_asset = { git = "https://github.com/fluid-notion-labs/bevy-r600", branch = "r600-0.19.1" }
