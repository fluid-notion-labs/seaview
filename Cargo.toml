[workspace]
members = ["crates/seaview"]
exclude = [
    "vendor/bevy",
    "vendor/bevy_brp",
    "vendor/loadfu",
    "vendor/loadfu-old",
    "vendor/mesh-ripper",
    "vendor/stl_io",
    "vendor/bevy_egui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Seaview Contributors"]

[workspace.dependencies]
bevy = { version = "0.18.0", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",

    "bevy_pbr",
    "bevy_render",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "multi_threaded",
    "wayland",
    "bevy_gizmos",
    "tonemapping_luts",
    "default_font",
    "png",
    "bevy_remote",
    "bevy_mesh",
    "bevy_image",
    "bevy_color",
    "bevy_shader",
    "bevy_gltf",
    "bevy_scene",
    "bevy_camera",
    "bevy_light",
    "bevy_post_process",
    "bevy_log",
    "zstd_rust",
    "reflect_auto_register",
] }
# bevy_egui = { git = "https://github.com/vladbat00/bevy_egui.git", rev = "fc54b193441e74e0317c5c8a158f73669670cf8f" }
bevy_egui = { path = "vendor/bevy_egui" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Performance-optimized release profile with maximum optimizations
# To disable logging at compile time, build with: cargo build --profile release-perf --features max-perf
[profile.release-perf]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.release-perf.package."*"]
opt-level = 3
